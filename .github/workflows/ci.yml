name: CI Python

on:
  push:
    branches:
      - main
      - feature/pipeline-premium
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q src

      - name: Validate command imports
        run: |
          python src/gerar_dataset_soja.py --help > /dev/null
          python src/gerar_dataset_5000.py --help > /dev/null
          python src/pipeline.py --help > /dev/null

      - name: Live smoke test - Planetary Computer Data API NPY
        run: python src/smoke_data_api.py

      - name: End-to-end - gerar 1 patch real
        run: python src/pipeline.py --mes 2026-04 --max-patches 1 --limpar

      - name: End-to-end - fila 5000 em modo reduzido com máscara agrícola
        run: python src/gerar_dataset_5000.py --mes 2026-04 --meta-total 1 --limpar
