name: CI Python

on:
  push:
    branches:
      - main
      - feature/pipeline-premium
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q src

      - name: Validate command imports
        run: |
          python src/baixar_series_temporais.py --help > /dev/null
          python src/gerar_mosaicos_temporais.py --help > /dev/null
          python src/gerar_patches.py --help > /dev/null
          python src/validar_dataset.py --help > /dev/null
          python src/pipeline.py --help > /dev/null
