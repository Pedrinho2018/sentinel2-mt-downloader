fonte:
  nome: "Microsoft Planetary Computer"
  stac_url: "https://planetarycomputer.microsoft.com/api/stac/v1"
  colecao: "sentinel-2-l2a"

projeto:
  nome: "Dataset Sentinel-2 para soja em Mato Grosso"
  objetivo: "Gerar recortes limpos, pequenos e temporalmente rastreáveis para catalogação e ML."

# TESTE CONTROLADO: centro-norte de Mato Grosso, em área agrícola.
# Não aumente para o estado inteiro antes de validar visualmente os patches.
aoi:
  nome: "Centro-Norte MT - teste soja"
  bbox_wgs84: [-56.00, -13.00, -55.30, -12.20]
  crs_metrico: "EPSG:31981"   # SIRGAS 2000 / UTM 21S

periodo:
  inicio: "2025-09-01"
  fim: "2026-04-30"

busca:
  # Filtro inicial só evita cenas absurdamente ruins. A decisão final é por patch.
  nuvem_cena_max_pct: 45
  max_cenas_por_mes: 8

patches:
  tamanho_px: 128
  resolucao_m: 10
  passo_px: 128
  max_patches_por_mes: 20

  # Só salva patch praticamente limpo.
  cobertura_limpa_min_pct: 99.5

  # Quantidade mínima de observações limpas disponíveis por pixel, usada apenas
  # como métrica de confiança. O patch não é reprovado por isso no primeiro teste.
  obs_2plus_min_pct: 0

  # Classes SCL aceitas como superfície observável.
  # 4 = vegetação, 5 = não vegetado/solo, 6 = água.
  scl_classes_validas: [4, 5, 6]

  # Margem adicional em volta de pixels não confiáveis, na grade final de 10 m.
  margem_nuvem_px: 4

  preview_saida_px: 768
  qualidade_jpeg: 95
  percentil_min: 2
  percentil_max: 98

  # Para não encher o PC: por padrão salva só preview + catálogo.
  # Os dados científicos podem ser regenerados pelos IDs/fontes registrados.
  salvar_npz: false

saida:
  pasta_patches: "data/patches_soja"
  catalogo: "catalogo/catalogo_soja.csv"
  resumo: "catalogo/resumo_soja.json"
