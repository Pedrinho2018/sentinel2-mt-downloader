stac:
  url: "https://data.inpe.br/bdc/stac/v1/"
  colecao: "S2-16D-2"

area:
  nome: "Mato Grosso"
  uf: "MT"
  bbox: [-61.65, -18.05, -50.20, -7.30]

periodo:
  inicio: "2025-09-01"
  fim: "2026-04-30"

bandas:
  - "B02"
  - "B03"
  - "B04"
  - "B08"
  - "NDVI"

# Filtro rigoroso no nível da cena. Cenas acima desse valor nunca entram
# automaticamente no gerador de patches.
qualidade:
  filtrar_nuvens: true
  nuvem_max_pct: 5

preview:
  gerar_rgb: true
  tamanho_max_px: 1600
  percentil_min: 2
  percentil_max: 98
  qualidade_jpeg: 94

download:
  pasta: "data/sentinel2"
  catalogo: "catalogo/catalogo_imagens.csv"
  timeout_segundos: 120
  chunk_mb: 1
  max_itens_teste: 5
  max_candidatos_teste: 120

patches:
  # 10 m/pixel -> 128 px ~= 1,28 km por lado.
  tamanho_px: 128
  passo_px: 128
  preview_saida_px: 768

  # Muito mais rígido que o filtro da cena.
  nuvem_max_pct: 0.5
  dados_validos_min_pct: 98

  # Dilata nuvem/sombra em 3 pixels para excluir também a borda contaminada.
  # Em 10 m/pixel, representa ~30 m de margem de segurança.
  margem_nuvem_px: 3

  exportar_tifs: false
  pasta: "data/patches"
  catalogo: "catalogo/catalogo_patches.csv"
  resumo: "catalogo/resumo_patches.json"
