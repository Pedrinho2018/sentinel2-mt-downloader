stac:
  url: "https://data.inpe.br/bdc/stac/v1/"
  colecao: "S2_L2A-1"

area:
  nome: "Mato Grosso"
  uf: "MT"
  bbox: [-61.65, -18.05, -50.20, -7.30]

  # Recorte pequeno apenas para validar o pipeline antes de escalar o estado.
  # Fica no centro-norte de MT, região com forte presença de agricultura.
  teste_bbox: [-56.30, -13.30, -55.00, -11.40]

periodo:
  inicio: "2025-09-01"
  fim: "2026-04-30"

# Bandas nativas de 10 m que serão baixadas das cenas L2A.
# NDVI passa a ser calculado no mosaico, evitando depender de produto derivado.
bandas:
  - "B02"
  - "B03"
  - "B04"
  - "B08"

download:
  pasta: "data/sentinel2_l2a"
  timeout_segundos: 240
  chunk_mb: 4

  # Compatibilidade com o downloader antigo; o pipeline principal não usa esse CSV.
  catalogo: "catalogo/catalogo_imagens.csv"
  max_itens_teste: 5
  max_candidatos_teste: 120

qualidade:
  filtrar_nuvens: true
  nuvem_max_pct: 20

# ESTÁGIO 1: cenas reais Sentinel-2 L2A, agrupadas por MGRS tile e mês.
serie_temporal:
  catalogo: "catalogo/catalogo_series.csv"
  resumo: "catalogo/resumo_series.json"

  # No teste, usa o bbox menor. Ao escalar, troque para false.
  usar_bbox_teste: true

  # O tile de teste é escolhido automaticamente pelo melhor histórico temporal.
  tile_teste: ""
  max_tiles_teste: 1

  # Avalia até 10 aquisições no mês e guarda até 6 fontes complementares.
  candidatos_por_tile_mes: 10
  cenas_por_tile_mes: 6

  # Cena muito ruim não vale espaço. Mesmo assim o limite é alto porque pixels
  # limpos ainda podem preencher lacunas no mosaico.
  nuvem_max_cena_pct: 70

# ESTÁGIO 2: composição mensal a partir das cenas L2A reais.
mosaico:
  origem_catalogo: "catalogo/catalogo_series.csv"
  pasta: "data/mosaicos_temporais"
  catalogo: "catalogo/catalogo_mosaicos.csv"
  resumo: "catalogo/resumo_mosaicos.json"

  agrupamento: "mensal"
  min_cenas_grupo: 2

  # SCL Sentinel-2: 4 vegetação, 5 não vegetado/solo, 6 água.
  # Classe 2 (dark area) fica fora para não aceitar sombra ambígua.
  classes_validas_scl: [4, 5, 6]
  classes_ruins_scl: [3, 7, 8, 9, 10, 11]

  # SCL é 20 m, mas será reprojetado por nearest para a grade de 10 m.
  # Depois aplicamos 6 pixels (~60 m) de margem ao redor de nuvens/sombras.
  margem_nuvem_px: 6

  bloco_px: 1024
  metodo: "primeiro_pixel_limpo_prioridade_centro_mes"

  # Mosaico com cobertura menor que isso não é liberado para catalogação.
  cobertura_valida_min_pct: 98.0

  preview_max_px: 1800
  percentil_min: 2
  percentil_max: 98
  qualidade_jpeg: 95

# ESTÁGIO 3: somente mosaicos aprovados viram patches.
patches:
  origem: "data/mosaicos_temporais"
  tamanho_px: 128
  passo_px: 128
  preview_saida_px: 768

  dados_validos_min_pct: 99.5
  obs_2plus_min_pct: 20

  exportar_tifs: false
  pasta: "data/patches"
  catalogo: "catalogo/catalogo_patches.csv"
  resumo: "catalogo/resumo_patches.json"

preview:
  gerar_rgb: true
  tamanho_max_px: 1600
  percentil_min: 2
  percentil_max: 98
  qualidade_jpeg: 95
