stac:
  url: "https://data.inpe.br/bdc/stac/v1/"
  colecao: "S2-16D-2"

area:
  nome: "Mato Grosso"
  uf: "MT"
  # Busca inicial por bounding box. O catálogo de patches preserva as coordenadas
  # de cada recorte para posterior cruzamento com limites oficiais e dados agrícolas.
  bbox: [-61.65, -18.05, -50.20, -7.30]

periodo:
  inicio: "2025-09-01"
  fim: "2026-04-30"

# Bandas científicas usadas no projeto de vigor vegetativo/soja.
bandas:
  - "B02"
  - "B03"
  - "B04"
  - "B08"
  - "NDVI"

# Filtro da cena antes do download das bandas grandes.
qualidade:
  filtrar_nuvens: true
  nuvem_max_pct: 20
  manter_scl: true

preview:
  gerar_rgb: true
  tamanho_max_px: 1600
  percentil_min: 2
  percentil_max: 98
  qualidade_jpeg: 94

download:
  pasta: "data/sentinel2"
  catalogo: "catalogo/catalogo_imagens.csv"
  timeout_segundos: 120
  chunk_mb: 1
  max_itens_teste: 5
  max_candidatos_teste: 40

# Segunda etapa: transforma cenas grandes em unidades adequadas para catalogação.
patches:
  # Sentinel-2 a 10 m: 128 px ~= 1,28 km por lado.
  # Mantém contexto suficiente do talhão, mas aproxima bastante a inspeção visual.
  tamanho_px: 128
  passo_px: 128

  # A imagem científica continua 128x128. Apenas o JPG de visualização é ampliado
  # para facilitar a catalogação no LabelImage, sem criar informação nova.
  preview_saida_px: 768

  # Filtro por patch mais rígido que o filtro da cena.
  nuvem_max_pct: 8
  dados_validos_min_pct: 90

  # Para evitar multiplicar o armazenamento, por padrão exportamos apenas o JPG
  # para rotulagem. O CSV guarda janela/coordenadas para recuperar as bandas originais.
  exportar_tifs: false

  pasta: "data/patches"
  catalogo: "catalogo/catalogo_patches.csv"
  resumo: "catalogo/resumo_patches.json"
