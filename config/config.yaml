fonte:
  nome: "Microsoft Planetary Computer"
  stac_url: "https://planetarycomputer.microsoft.com/api/stac/v1"
  data_api_url: "https://planetarycomputer.microsoft.com/api/data/v1"
  colecao: "sentinel-2-l2a"

projeto:
  nome: "Dataset Sentinel-2 para soja em Mato Grosso"
  objetivo: "Gerar patches limpos, pequenos e temporalmente rastreáveis para catalogação e ML."

aoi:
  nome: "Centro-Norte MT - teste soja"
  bbox_wgs84: [-56.00, -13.00, -55.30, -12.20]
  crs_metrico: "EPSG:31981"

periodo:
  inicio: "2025-09-01"
  fim: "2026-04-30"

busca:
  # O percentual da cena inteira serve apenas como pré-filtro.
  # A decisão final é feita pixel a pixel pelo SCL dentro de cada patch.
  nuvem_cena_max_pct: 80
  max_itens_busca_mes: 120
  max_cenas_por_patch: 10

http:
  timeout_segundos: 90
  tentativas: 4
  backoff_segundos: 1.0

patches:
  tamanho_px: 128
  resolucao_m: 10
  passo_px: 128
  max_patches_por_mes: 20

  # Patch final praticamente sem contaminação.
  cobertura_limpa_min_pct: 99.5

  # Classes SCL observáveis: vegetação, solo/não vegetado e água.
  scl_classes_validas: [4, 5, 6]

  # Borda de segurança contra nuvem/sombra na grade final.
  margem_nuvem_px: 4

  preview_saida_px: 768
  qualidade_jpeg: 95
  percentil_min: 2
  percentil_max: 98

  # Para não encher o PC, por padrão salva só preview + catálogo.
  salvar_npz: false

# Pré-filtro de área agrícola. Serve apenas para evitar mata/água/cidade em excesso.
# NÃO é rótulo de soja e NÃO substitui a catalogação humana.
mascara_agricola:
  usar: true
  colecao: "esa-worldcover"
  asset: "map"
  ano_referencia: 2021
  classe_cropland: 40
  cropland_min_pct: 35.0
  cobertura_min_pct: 95.0
  tamanho_amostra_px: 64
  cache: "catalogo/cache_mascara_agricola.csv"

# Produção da fila principal de catalogação.
dataset_5000:
  meta_total_imagens: 5000
  seed_espacial: 20260820

  # Mantém uma reserva de localizações agrícolas caso algum patch seja reprovado
  # em meses muito nublados.
  fator_reserva_espacial: 2.0

  classes_rotulacao:
    - "SOJA"
    - "NAO_SOJA"
    - "INCERTO"

  # O split é calculado pelo spatial_id. O mesmo local nunca muda de conjunto.
  split:
    treino_pct: 70
    validacao_pct: 15
    teste_pct: 15

saida:
  pasta_patches: "data/patches_soja"
  catalogo: "catalogo/catalogo_soja.csv"
  resumo: "catalogo/resumo_soja.json"

saida_5000:
  pasta_patches: "data/dataset_soja_5000"
  catalogo: "catalogo/catalogo_soja_5000.csv"
  fila: "catalogo/fila_catalogacao_5000.csv"
  resumo: "catalogo/resumo_soja_5000.json"
